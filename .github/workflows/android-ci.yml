name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: powershell
        run: |
          $sdkRoot = Join-Path $env:USERPROFILE ".android\sdk"
          $sdkManager = Join-Path $sdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkManager)) {
            $archive = Join-Path $env:RUNNER_TEMP "android-commandlinetools.zip"
            $extract = Join-Path $env:RUNNER_TEMP "android-commandlinetools"
            Invoke-WebRequest "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip" -OutFile $archive
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            Expand-Archive -Path $archive -DestinationPath $extract -Force
            New-Item -ItemType Directory -Force -Path (Split-Path $sdkManager) | Out-Null
            Copy-Item (Join-Path $extract "cmdline-tools\*") (Join-Path $sdkRoot "cmdline-tools\latest") -Recurse -Force
          }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $licensesDir = Join-Path $sdkRoot "licenses"
          New-Item -ItemType Directory -Force -Path $licensesDir | Out-Null
          @(
            "8933bad161af4178b1185d1a37fbf41ea5269c55"
            "d56f5187479451eabf01fb78af6dfcb131a6481e"
            "24333f8a63b6825ea9c5514f83c2829b004d1fee"
          ) | Set-Content -Path (Join-Path $licensesDir "android-sdk-license") -Encoding ascii
          & $sdkManager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle project
        run: ./gradlew projects
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Run connected instrumentation tests when a device is available
        shell: powershell
        run: |
          $adb = Join-Path $env:ANDROID_HOME "platform-tools\adb.exe"
          $connected = (& $adb devices) | Select-String "\tdevice$"
          if ($connected) {
            ./gradlew connectedDebugAndroidTest
          } else {
            Write-Warning "No connected Android device; connected instrumentation verification remains pending."
          }
      - name: Run lint and build debug APK
        run: ./gradlew lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HelioFlux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
